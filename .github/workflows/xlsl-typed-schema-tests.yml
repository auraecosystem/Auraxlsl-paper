name: XLSL typed schema tests

on:
  pull_request:
    paths:
      - "xlsl/**"
      - "tests/test_xlsl_package.py"
      - "tests/test_xlsl_typed_schema.py"\n      - "tests/test_xlsl_relations.py"\n      - "tests/test_xlsl_migrations.py"
      - "docs/XLSL-V1-TYPED-SCHEMA.md"
      - ".github/workflows/xlsl-typed-schema-tests.yml"
  push:
    branches:
      - "feature/xlsl-typed-schema-v1"\n      - "feature/xlsl-relations-migrations-v1"
    paths:
      - "xlsl/**"
      - "tests/test_xlsl_package.py"
      - "tests/test_xlsl_typed_schema.py"
      - ".github/workflows/xlsl-typed-schema-tests.yml"

permissions:
  contents: read

jobs:
  typed-schema-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run XLSL tests
        run: |
          python -m unittest discover -s tests -p "test_xlsl_package.py" -v
          python -m unittest discover -s tests -p "test_xlsl_typed_schema.py" -v\n          python -m unittest discover -s tests -p "test_xlsl_relations.py" -v\n          python -m unittest discover -s tests -p "test_xlsl_migrations.py" -v
