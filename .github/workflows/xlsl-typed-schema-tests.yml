name: XLSL package tests

on:
  pull_request:
    paths:
      - "xlsl/**"
      - "tests/test_xlsl_package.py"
      - "tests/test_xlsl_typed_schema.py"
      - ".github/workflows/xlsl-package-tests.yml"
  push:
    branches:
      - "feature/xlsl-v1-package-foundation"
    paths:
      - "xlsl/**"
      - "tests/test_xlsl_package.py"
      - ".github/workflows/xlsl-package-tests.yml"

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run XLSL package tests
        run: python -m unittest discover -s tests -p "test_xlsl_package.py" -v
