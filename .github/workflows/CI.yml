name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
      - name: Compile core modules
        run: python -m compileall -q AuraQuantum api circuits.py
      - name: Run tests
        run: python -m pytest -q
  powershell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -ErrorAction Stop
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse
          if ($scripts) {
            $issues = $scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName }
            $errors = @($issues | Where-Object { $_.Severity -eq 'Error' })
            if ($errors.Count -gt 0) {
              $errors | Format-Table
              throw "PSScriptAnalyzer found $($errors.Count) errors."
            }
          }
