[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auraxlsl-paper"
version = "0.1.0"
description = "AuraXLSL scientific spreadsheets, notebooks, and quantum simulation tools"
authors = [{ name = "Seriki walter Yakub" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.25", "pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8"]
science = ["scikit-learn>=1.3", "pyyaml>=6.0"]
test = ["pytest>=7.0"]
gpu = ["cupy"]

[tool.setuptools.packages.find]
include = ["AuraQuantum*", "api*"]
